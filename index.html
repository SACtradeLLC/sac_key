<body>
<div id="app"></div>

<script>
'use strict';
/* =========================================================
   sac_key — 1ファイルで動く、家族2人用のパスワード・口座管理
   ・データはこのブラウザの中（localStorage）に AES-GCM で暗号化して保存
   ・鍵はパスワードから PBKDF2 で作る。平文はどこにも書かない
   ・共有はクラウド（Supabase）に暗号化したまま置く。控えは書き出し／読み込み
   ========================================================= */

const STORE_KEY = 'ienokinko.vault.v1';
const IDLE_LOCK_MS = 5 * 60 * 1000;   // 5分さわらなければ自動ロック
const PBKDF2_ITER = 600000;

const CATEGORIES = ['銀行口座', 'クレジットカード', 'ログイン', 'その他'];
const TEMPLATES = {
  '銀行口座': [['銀行名', false], ['支店名', false], ['口座種別', false], ['口座番号', true], ['口座名義', false], ['ネットバンキングID', false], ['ログインパスワード', true], ['暗証番号', true]],
  'クレジットカード': [['カード会社', false], ['カード番号', true], ['名義', false], ['有効期限', true], ['セキュリティコード', true], ['暗証番号', true], ['会員サイトID', false], ['会員サイトパスワード', true]],
  'ログイン': [['URL', false], ['ID・メール', false], ['パスワード', true]],
  'その他': [['内容', true]],
};
const DEFAULT_FIELDS = [['ID', false], ['パスワード', true]];
const fieldsFor = cat => (TEMPLATES[cat] || DEFAULT_FIELDS).map(([label, secret]) => ({ label, value: '', secret }));
/* タグ：1件に複数。古いデータの category（1つだけ）も読めるようにする。保存時は category に先頭のタグも入れておく */
const tagsOf = it => (Array.isArray(it.tags) && it.tags.length ? it.tags : (it.category ? [it.category] : []));
const setTags = (it, tags) => { it.tags = [...new Set(tags.map(t => String(t).trim()).filter(Boolean))]; if (!it.tags.length) it.tags = ['その他']; it.category = it.tags[0]; return it; };
const usedTags = () => { const u = new Set(S.items.flatMap(tagsOf)); return [...CATEGORIES.filter(c => u.has(c)), ...[...u].filter(c => !CATEGORIES.includes(c)).sort((a, b) => a.localeCompare(b, 'ja'))]; };
const allCats = () => [...new Set([...CATEGORIES, ...S.items.flatMap(tagsOf)])];
/* 押すだけで足せる項目 */
const QUICK_FIELDS = ['ID・メール', 'パスワード', '暗証番号', '電話用パスワード', 'IC用暗証番号', '口座番号', '支店名', 'カード番号', 'セキュリティコード', '有効期限', '記号番号', '会員番号', 'URL', '電話番号'];
/* 1行にまとまった値を分ける。「暗証番号:1234 / 有効期限:12/28」や改行・読点区切りを、項目名と値の組に */
function splitValue(text) {
  if (/^https?:\/\//i.test(String(text || '').trim())) return [{ label: '', value: text }];
  const parts = String(text || '').split(/\r?\n|(?<!\d)[\/／](?!\d)|[、，;；|｜]|,(?!\d{3})|\s{2,}|　/).map(x => x.trim()).filter(Boolean);
  const out = [];
  for (const p of parts) {
    const m = /^([^:：=＝]{1,20}?)\s*[:：=＝]\s*(.+)$/.exec(p);
    if (m) { out.push({ label: m[1].trim(), value: m[2].trim() }); continue; }
    // 「暗証番号 1234 セキュリティ 567」のように空白区切り：文字の語のあとに数字を含む語が来たら組にする
    const tk = p.split(/\s+/);
    for (let i = 0; i < tk.length; i++) {
      if (!/\d/.test(tk[i]) && i + 1 < tk.length && /\d/.test(tk[i + 1])) { out.push({ label: tk[i], value: tk[i + 1] }); i++; }
      else out.push({ label: '', value: tk[i] });
    }
  }
  return out;
}
/* ---------- 自動整理：中身からタグを推測して足し、「その他の情報」のような1行まとめを項目に分ける ----------
   AI は中身を見ない。komi のブラウザの中で、このルールだけで動く */
const TAG_RULES = [
  ['銀行口座', /銀行|信金|信用金庫|信用組合|ゆうちょ|労働金庫|ろうきん|口座番号|支店名|口座種別|ネットバンキング/i],
  ['クレジットカード', /(?<!キャッシュ|ポイント)カード|アメックス|アメリカン|amex|visa|jcb|master|ダイナース|diners|セキュリティコード|有効期限|カード番号/i],
  ['証券・投資', /証券|nisa|ニーサ|ideco|イデコ|投資|株取引|fx|仮想通貨|暗号資産|bitflyer|coincheck|コインチェック/i],
  ['電子マネー・決済', /paypay|ペイペイ|楽天ペイ|メルペイ|d払い|au ?pay|suica|スイカ|pasmo|nanaco|waon|paypal|ペイパル|stripe/i],
  ['携帯・通信', /携帯|スマホ|docomo|ドコモ|ソフトバンク|softbank|楽天モバイル|ahamo|povo|linemo|uq|ワイモバイル|y!mobile|wi-?fi|プロバイダ|光回線|nuro|ocn|eo光/i],
  ['ネットショップ・物販', /amazon|アマゾン|楽天市場|ヤフオク|yahoo|ヤフー|メルカリ|ラクマ|ebay|イーベイ|モノタロウ|ヨドバシ|ジモティ|zozo|shopify|thebase|base\.in/i],
  ['SNS', /instagram|インスタ|facebook|フェイスブック|twitter|ツイッター|x\.com|tiktok|ティックトック|youtube|ユーチューブ|threads|note\.com|公式line|line公式|lステップ|エルメ/i],
  ['仕事ツール・AI', /google|gmail|グーグル|apple|icloud|microsoft|マイクロソフト|outlook|chatgpt|openai|claude|anthropic|gemini|canva|キャンバ|notion|github|vercel|supabase|zoom|slack|chatwork|dropbox|adobe|freee|マネーフォワード|弥生|wordpress|ドメイン|サーバー|xserver|エックスサーバー|お名前\.com/i],
  ['動画・音楽', /netflix|ネットフリックス|hulu|u-?next|アマプラ|prime video|disney|ディズニー|abema|dazn|spotify|apple music|youtube premium/i],
  ['保険', /保険|共済/i],
  ['役所・公共', /マイナ|年金|e-?tax|イータックス|国税|税務署|ふるさと納税|住民|市役所|区役所|健康保険|ねんきん/i],
  ['光熱費', /電気|ガス|水道|電力|東京ガス|大阪ガス/i],
  ['会社・事業', /合同会社|株式会社|法人|sac|しろまる|くらしのマーケット|ミツモア|ジモティー|事業|請求|取引先/i],
];
const OTHER_LABEL = /^$|その他|情報|備考|詳細|メモ|補足/;
function organizeItem(it) {
  let changed = false, splits = 0;
  // 1) 1行まとめを分ける（項目名が「その他の情報」などのときだけ。半分以上に項目名が付くときだけ）
  const nf = [];
  for (const f of it.fields) {
    const parts = OTHER_LABEL.test((f.label || '').trim()) ? splitValue(f.value) : [];
    if (parts.length > 1 && parts.filter(x => x.label).length * 2 >= parts.length) {
      parts.forEach(x => nf.push({ label: x.label, value: x.value, secret: x.label ? (SECRET_WORDS.test(x.label) || f.secret) : f.secret }));
      splits++; changed = true;
    } else nf.push(f);
  }
  it.fields = nf;
  // 2) タグを推測して足す（今のタグは消さない。具体的なタグが付いたら「その他」だけ外す）
  const text = [it.title, ...it.fields.map(f => f.label), ...it.fields.filter(f => !f.secret).map(f => f.value), it.memo].join(' ');
  const tags = [...tagsOf(it)];
  for (const [tag, re] of TAG_RULES) if (re.test(text) && !tags.includes(tag)) tags.push(tag);
  if ((findField(it, ID_RE) && findField(it, PW_RE)) || it.fields.some(f => /^https?:\/\//i.test(f.value))) { if (!tags.includes('ログイン')) tags.push('ログイン'); }
  const finalTags = tags.length > 1 ? tags.filter(t => t !== 'その他') : tags;
  if (finalTags.join('\n') !== tagsOf(it).join('\n') || !Array.isArray(it.tags)) { setTags(it, finalTags); changed = true; }
  if (changed) it.updated = now();
  return { changed, splits };
}
const ORG_FLAG = 'sackey.organized.v1', ORG_BACKUP = 'sackey.backup.beforeOrganize';
async function autoOrganize(force) {
  if (!S.key) return;
  let done = false; try { done = localStorage.getItem(ORG_FLAG) === '1'; } catch (e) {}
  if (done && !force) return;
  try { const cur = localStorage.getItem(STORE_KEY); if (cur) localStorage.setItem(ORG_BACKUP, cur); } catch (e) {}
  let n = 0, sp = 0;
  for (const it of S.items) { const r = organizeItem(it); if (r.changed) n++; sp += r.splits; }
  try { localStorage.setItem(ORG_FLAG, '1'); } catch (e) {}
  if (n) { await persist(); toast(`自動で整理しました：${n}件のタグを見直し、${sp}か所を項目に分けました。設定から元に戻せます`); }
  else if (force) toast('整理するものはありませんでした');
}
async function undoOrganize() {
  let blob; try { blob = JSON.parse(localStorage.getItem(ORG_BACKUP) || 'null'); } catch (e) {}
  if (!blob) return toast('戻せる控えがありません');
  let r; try { r = await decryptWithKey(blob, S.key); } catch (e) { return toast('控えを開けませんでした（パスワードを変えた後は戻せません）'); }
  const t = now(); S.items = r.items.map(it => ({ ...it, updated: t }));
  await persist(); toast('整理する前に戻しました');
}
/* 「分ける」ボタンを出すか：2つ以上に分かれ、少なくとも1つに項目名が付くときだけ（ただのパスワードには出さない） */
const canSplit = v => { const r = splitValue(v); return r.length > 1 && r.some(x => x.label) ? r.length : 0; };
const catFromFileName = name => { const m = String(name || '').replace(/\.[^.]+$/, '').split(/\s+-\s+/); return m.length > 1 ? m[m.length - 1].trim() : ''; };
const SECRET_WORDS = /パスワード|password|pass|pw|ＰＷ|暗証|pin|番号|number|no\.|コード|code|セキュリティ|cvv|cvc|秘密|鍵|key|token|トークン|期限|認証/i;
const TITLE_WORDS = /名前|名称|サービス|口座名|サイト|銀行名|カード会社|項目名|タイトル|title|name|site/i;
const CAT_WORDS = /^(分類|種類|カテゴリ|カテゴリー|category|type)$/i;
const MEMO_WORDS = /メモ|備考|note|memo|元シート|出典|source/i;

/* ---------- 小道具 ---------- */
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64 = u8 => btoa(String.fromCharCode(...u8));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const now = () => new Date().toISOString();
const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? '' : `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const today = () => new Date().toISOString().slice(0, 10);

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast('コピーしました');
}

/* ---------- 暗号（Web Crypto） ---------- */
async function deriveKey(password, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptItems(key, salt, iterations, items, deleted = {}) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = new TextEncoder().encode(JSON.stringify({ items, deleted }));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data);
  return { app: 'ienokinko', v: 1, kdf: { name: 'PBKDF2-SHA256', iterations }, salt: b64(salt), iv: b64(iv), data: b64(new Uint8Array(ct)), savedAt: now() };
}
async function decryptWithKey(blob, key) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(blob.iv) }, key, unb64(blob.data));
  const obj = JSON.parse(new TextDecoder().decode(pt));
  return { key, salt: unb64(blob.salt), items: obj.items || [], deleted: obj.deleted || {} };
}
async function decryptBlob(blob, password) {
  const key = await deriveKey(password, unb64(blob.salt), blob.kdf?.iterations || PBKDF2_ITER);
  return decryptWithKey(blob, key);
}

/* 鍵の記憶：鍵そのもの（取り出せない形）をブラウザの IndexedDB に置く。パスワードは保存しない */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('sackey', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('keys');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbPut(k, v) { try { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction('keys', 'readwrite'); t.objectStore('keys').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; } catch (e) { console.warn('idbPut', k, e); return false; } }
async function idbGet(k) { try { const db = await idb(); return await new Promise((res, rej) => { const r = db.transaction('keys').objectStore('keys').get(k); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); }); } catch (e) { return null; } }
async function idbDel(k) { try { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction('keys', 'readwrite'); t.objectStore('keys').delete(k); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) {} }
async function rememberKey(key) { if (await idbPut('main', key)) S.remembered = true; }
async function loadRememberedKey() { return idbGet('main'); }
async function forgetKey() { await idbDel('main'); S.remembered = false; }

/* ---------- クラウド（Supabase）：暗号化したまま1行に保存。パスワードは送らない ---------- */
const CFG = window.SACKEY_CONFIG || {};
const CLOUD_OK = !!(CFG.url && CFG.anonKey && window.supabase);
let sb = null;
async function cloudInit() {
  if (!CLOUD_OK) return;
  sb = window.supabase.createClient(CFG.url, CFG.anonKey);
  try { const { data } = await sb.auth.getSession(); S.cloudUser = data?.session?.user?.email || null; } catch (e) { S.cloudUser = null; }
}
async function cloudLogin(email, password) {
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) throw error;
  S.cloudUser = email; S.cloudStatus = 'ok'; S.cloudError = '';
}
async function cloudLogout() { try { await sb.auth.signOut(); } catch (e) {} S.cloudUser = null; S.cloudStatus = 'none'; }
async function cloudPull() {
  const { data, error } = await sb.from('vault').select('data').eq('id', 'main').maybeSingle();
  if (error) throw error;
  return data?.data || null;
}
async function cloudPush(blob) {
  const { error } = await sb.from('vault').upsert({ id: 'main', data: blob, updated_at: now() });
  if (error) throw error;
}
function cloudErrText(e) {
  const m = (e && (e.message || String(e))) || '';
  if (/row-level security|permission denied|42501/i.test(m)) return 'このメールはメンバーに入っていません（Supabase の vault_members を確認）';
  if (/Invalid login/i.test(m)) return 'メールかパスワードが違います';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'ネットにつながっていません';
  return m;
}
/* クラウドと合わせる：読む → マージ → 書く */
async function syncCloud() {
  if (!sb || !S.cloudUser || !S.key) return;
  S.cloudStatus = 'syncing';
  try {
    const blob = await cloudPull();
    if (blob) {
      if (blob.app !== 'ienokinko') throw new Error('sac_key のデータではありません');
      let r; try { r = await decryptWithKey(blob, S.key); }
      catch (e) { S.cloudStatus = 'error'; S.cloudError = 'クラウドのデータは別のパスワードで作られています。設定の「クラウドのデータに合わせる」を押してください'; return; }
      const m = mergeItems(r.items, r.deleted);
      if (m.added || m.updated || m.removed) toast(`クラウドと合わせました：追加 ${m.added}・更新 ${m.updated}・削除 ${m.removed}`);
    }
    S.cloudStatus = 'ok'; S.cloudError = '';
    await persist();
  } catch (e) { S.cloudStatus = 'error'; S.cloudError = cloudErrText(e); }
}
/* このブラウザのデータを捨てて、クラウドのデータを採用する（パスワードが違うとき用） */
async function adoptCloud() {
  const blob = await cloudPull(); if (!blob) return toast('クラウドにデータがありません');
  saveBlobRaw(blob); await forgetKey(); S.cloudStatus = 'none';
  S.key = null; S.items = []; S.deleted = {}; toast('クラウドのデータに合わせました。そのパスワードで開いてください'); nav('list', null, true);
}

/* 消した記録（id → 消した日時）。相手の控えから復活しないように、クラウドにも残す。180日で掃除 */
function markDeleted(id) { S.deleted[id] = now(); }
function pruneDeleted() {
  const limit = new Date(Date.now() - 180 * 24 * 3600 * 1000).toISOString();
  for (const id of Object.keys(S.deleted)) if (S.deleted[id] < limit) delete S.deleted[id];
}
function mergeItems(remote, remoteDeleted = {}) {
  let added = 0, updated = 0, removed = 0;
  for (const [id, t] of Object.entries(remoteDeleted)) {
    if (!S.deleted[id] || S.deleted[id] < t) S.deleted[id] = t;
    const i = S.items.findIndex(x => x.id === id);
    if (i >= 0 && (S.items[i].updated || '') <= t) { S.items.splice(i, 1); removed++; }
  }
  for (const it of remote) {
    if (S.deleted[it.id] && (it.updated || '') <= S.deleted[it.id]) continue;
    const i = S.items.findIndex(x => x.id === it.id);
    if (i < 0) { S.items.push(it); added++; }
    else if ((it.updated || '') > (S.items[i].updated || '')) { S.items[i] = it; updated++; }
  }
  return { added, updated, removed };
}

/* ---------- 保存 ---------- */
function loadBlob() { try { const s = localStorage.getItem(STORE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function saveBlobRaw(blob) { localStorage.setItem(STORE_KEY, JSON.stringify(blob)); }

/* ---------- 状態 ---------- */
const MASK_KEY = 'sackey.mask';
const S = { mask: (() => { try { return localStorage.getItem(MASK_KEY) === '1'; } catch (e) { return false; } })(), key: null, salt: null, iter: PBKDF2_ITER, items: [], deleted: {}, remembered: false, cloudUser: null, cloudStatus: 'none', cloudError: '', view: 'list', cat: 'すべて', q: '', editId: null, detailId: null, shown: new Set() };

async function persist() {
  pruneDeleted();
  const blob = await encryptItems(S.key, S.salt, S.iter, S.items, S.deleted);
  saveBlobRaw(blob);
  if (sb && S.cloudUser && S.cloudStatus !== 'error') {
    try { await cloudPush(blob); S.cloudStatus = 'ok'; }
    catch (e) { S.cloudStatus = 'error'; S.cloudError = cloudErrText(e); toast('クラウドに保存できませんでした：' + S.cloudError); }
  }
}
async function lock() {
  if (S.remembered) { await forgetKey(); toast('ロックしました。次はパスワードが要ります'); }
  S.key = null; S.salt = null; S.items = []; S.view = 'list'; S.detailId = null; S.editId = null; S.shown.clear();
  nav('list', null, true);
}
/* 画面遷移：#list / #detail=ID / #edit=ID / #edit=new / #settings / #csv */
function hashFor(view, id) { return '#' + view + (id ? '=' + encodeURIComponent(id) : ''); }
function nav(view, id, replace) {
  const h = hashFor(view, id);
  if (location.hash === h) { applyHash(); return; }
  if (replace) location.replace(h); else location.hash = h;   // hashchange → applyHash → render
}
function applyHash() {
  const m = /^#(list|detail|edit|settings|csv)(?:=(.*))?$/.exec(location.hash);
  if (!m) { S.view = 'list'; }
  else {
    S.view = m[1]; const id = m[2] ? decodeURIComponent(m[2]) : null;
    if (S.view === 'detail') { if (id !== S.detailId) S.shown.clear(); S.detailId = id; }
    if (S.view === 'edit') S.editId = id === 'new' ? null : id;
  }
  render();
}
window.addEventListener('hashchange', applyHash);
let idleTimer;
function bumpIdle() {
  clearTimeout(idleTimer);
  if (S.key && !S.remembered) idleTimer = setTimeout(() => { lock(); toast('しばらく操作がなかったのでロックしました'); }, IDLE_LOCK_MS);
}
['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, bumpIdle, { passive: true }));

/* ---------- 画面 ---------- */
const app = $('#app');

function render() {
  if (!S.key) { return loadBlob() ? renderUnlock() : renderSetup(); }
  bumpIdle();
  if (S.view === 'detail') return renderDetail();
  if (S.view === 'edit') return renderEdit();
  if (S.view === 'settings') return renderSettings();
  if (S.view === 'csv') return renderCsv();
  return renderList();
}

/* ロック解除 */
function renderUnlock() {
  app.innerHTML = `
  <div class="card center">
    <h1>sac_key</h1>

function genPassword(len = 16) {
  const chars = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!#$%&*+-=?@';
  const a = crypto.getRandomValues(new Uint32Array(len));
  return Array.from(a, n => chars[n % chars.length]).join('');
}

/* ラベル形式（【カード名】の下に「項目名, 値」が縦に並ぶ表）の読み取り */
const HEAD_RE = /^[\s☆彡★◎○●]*【/;
const ACCOUNT_WORDS = /銀行|カード|カ－ド|アメックス|アメリカン|amex|visa|jcb|master|証券|信金|公庫|ゆうちょ|paypay|ペイ/i;
const isBlockLayout = rows => rows.some(r => r.some(c => HEAD_RE.test(c)));
function parseBlocks(rows, defaultCat) {
  // ラベル列 = 【見出し】が現れる列。その右隣が値列
  const labelCols = [...new Set(rows.flatMap(r => r.map((c, i) => HEAD_RE.test(c) ? i : -1).filter(i => i >= 0)))].sort((a, b) => a - b);
  if (!labelCols.length) return [];
  const cat = {}, cur = {}, items = [];
  const cell = (r, i) => (rows[r][i] || '').trim();
  const startItem = (c, title, r) => {
    const it = { id: uid(), category: cat[c] || defaultCat, title: title.replace(/^[\s☆彡★◎○●]*/, '').replace(/[【】]/g, ' ').replace(/\s+/g, ' ').trim(), fields: [], memo: '', updated: now(), _row: r };
    items.push(it); cur[c] = it; return it;
  };
  const nearest = c => { for (let k = c; k >= 0; k--) if (cur[k]) return cur[k]; return null; };
  const addMemo = (it, text) => { if (it) it.memo = it.memo ? it.memo + '\n' + text : text; };
  for (let r = 0; r < rows.length; r++) {
    const used = new Set();
    for (const c of labelCols) {
      const label = cell(r, c), value = cell(r, c + 1);
      used.add(c); used.add(c + 1);
      if (!label && !value) continue;
      if (!label) { const it = cur[c] || nearest(c); if (it) it.fields.push({ label: '', value, secret: true }); continue; }
      if (!value) {
        if (r === 0 && !cur[c]) { cat[c] = label; continue; }               // 1行目の「クレジットカード」「銀行」は種類
        if (/^[\w\-+#@\/=!?.]+$/.test(label) && /\d/.test(label)) {          // 数字だけの行（暗証番号など）は項目名なしの秘密として扱う
          const it = cur[c] || nearest(c); if (it) { it.fields.push({ label: '', value: label, secret: true }); continue; }
        }
        const prevBlank = r === 0 || !cell(r - 1, c);
        if (HEAD_RE.test(label) || prevBlank || ACCOUNT_WORDS.test(label)) startItem(c, label, r);
        else addMemo(cur[c] || nearest(c), label);
        continue;
      }
      if (HEAD_RE.test(label)) { const it = startItem(c, label, r); it.fields.push({ label: '', value, secret: true }); continue; }
      const it = cur[c] || startItem(c, '（無題）', r);
      it.fields.push({ label, value, secret: SECRET_WORDS.test(label) });
    }
    // ラベル列でも値列でもない場所に何か書いてあれば、いちばん近い項目のメモへ
    rows[r].forEach((v, i) => { if (!used.has(i) && (v || '').trim()) addMemo(nearest(i), v.trim()); });
  }
  return items.filter(it => it.fields.length || it.memo).map(it => { delete it._row; return it; });
}

/* CSV 取り込み */
function parseCsv(text) {
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false; }
      else cell += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}

    const opts = [['title', '名前にする'], ['cat', '種類にする（行ごとに分ける）'], ['plain', '項目（そのまま表示）'], ['secret', '項目（秘密・隠す）'], ['memo', 'メモに入れる'], ['skip', '取り込まない']];
    $('#mapArea').innerHTML = `
      <div class="meta">${body.length}行 見つかりました。各列をどう扱うか決めてください。</div>
      <label>取り込む先の種類（「種類にする」列がある行はそちらを優先。ない行に付ける種類）</label>
      <input type="text" id="csvCat" list="csvCatList" value="${esc(defaultCat)}" autocomplete="off">
      <datalist id="csvCatList">${allCats().map(c => `<option value="${esc(c)}">`).join('')}</datalist>
      <table class="map" style="margin-top:10px">
        ${headers.map((h, i) => { const g = guess(h); return `<tr><td>${esc(h)}<div class="hint" style="font-size:12px">例：${esc((body[0][i] || '').slice(0, 20))}${g === 'secret' ? '' : ''}</div></td><td><select class="mapSel" data-i="${i}">${opts.map(([v, l]) => `<option value="${v}" ${v === g ? 'selected' : ''}>${l}</option>`).join('')}</select></td></tr>`; }).join('')}
      </table>
      <div class="err" id="cerr"></div>
      <button class="primary block" id="doImport">この設定で取り込む</button>`;
    if (!titleGuessed) { const first = $$('.mapSel').find(s => s.value !== 'cat'); if (first) first.value = 'title'; }
    $('#doImport').onclick = async () => {
      const map = $$('.mapSel').map(s => s.value);
      if (!map.includes('title')) return $('#cerr').textContent = '「名前にする」列を1つ選んでください';
      const cat = $('#csvCat').value.trim() || 'その他'; let n = 0;
      for (const r of body) {
        const it = { id: uid(), category: cat, title: '', fields: [], memo: '', updated: now() };
        const memos = [];
        r.forEach((v, i) => {
          v = (v || '').trim(); if (!v || !headers[i]) return;
          const m = map[i] || 'skip';
          if (m === 'title') it.title = it.title ? it.title + ' ' + v : v;
          else if (m === 'cat') it.category = v;
          else if (m === 'memo') memos.push(v);
          else if (m === 'plain') it.fields.push({ label: headers[i], value: v, secret: false });
          else if (m === 'secret') it.fields.push({ label: headers[i], value: v, secret: true });
        });
        it.memo = memos.join('\n');
        if (!it.title && !it.fields.length) continue;
        if (!it.title) it.title = '（無題）';
        setTags(it, [it.category]); S.items.push(it); n++;
      }
      await persist(); S.cat = cat; toast(`${n}件 取り込みました`); nav('list', null, true);
    };
  }
  function showBlocks(rows, defaultCat) {
    const items = parseBlocks(rows, defaultCat);
    if (!items.length) return toast('読み取れませんでした');
    $('#mapArea').innerHTML = `
      <div class="meta">「【名前】の下に項目名と値が並ぶ形」として読みました。${items.length}件 見つかりました。取り込んだあと、1件ずつ開いて直せます。</div>
      <label>「種類」が付かなかったものに付ける種類</label>
      <input type="text" id="blkCat" list="blkCatList" value="${esc(defaultCat)}" autocomplete="off">
      <datalist id="blkCatList">${allCats().map(c => `<option value="${esc(c)}">`).join('')}</datalist>
      <div class="list" style="margin-top:10px">
        ${items.map((it, i) => `<label class="item" style="cursor:pointer"><input type="checkbox" class="blkSel" data-i="${i}" checked style="margin-right:8px">
          <div style="min-width:0;flex:1"><div class="t">${esc(it.title)}</div><div class="s">${it.fields.length}項目${it.fields.some(f => !f.label) ? '（項目名のない値あり）' : ''}${it.memo ? '・メモあり' : ''}</div></div>
          <div class="c">${esc(it.category)}</div></label>`).join('')}
      </div>
      <button class="primary block" id="doBlk">チェックしたものを取り込む</button>`;
    $('#doBlk').onclick = async () => {
      const fallback = $('#blkCat').value.trim() || 'その他';
      const sel = $$('.blkSel').filter(c => c.checked).map(c => items[+c.dataset.i]);
      for (const it of sel) { if (it.category === defaultCat) it.category = fallback; setTags(it, [it.category]); S.items.push(it); }
      await persist(); S.cat = 'すべて'; toast(`${sel.length}件 取り込みました`); nav('list', null, true);
    };
  }
}

/* ---------- 起動 ---------- */
if (!window.isSecureContext || !crypto.subtle) {
  app.innerHTML = `<div class="card center"><h1>sac_key</h1><p class="hint">このブラウザでは暗号化機能が使えません。Safari か Chrome でファイルを直接開いてください。</p></div>`;
} else {
  if (!location.hash) location.replace('#list');
  (async () => {
    await cloudInit();
    if (sb && S.cloudUser && !loadBlob()) { try { const cb = await cloudPull(); if (cb) saveBlobRaw(cb); } catch (e) { S.cloudStatus = 'error'; S.cloudError = cloudErrText(e); } }
    const blob = loadBlob(), key = blob && await loadRememberedKey();
    if (key) {
      try { const r = await decryptWithKey(blob, key); S.key = r.key; S.salt = r.salt; S.iter = blob.kdf?.iterations || PBKDF2_ITER; S.items = r.items; S.deleted = r.deleted; S.remembered = true; }
      catch (e) { await forgetKey(); }
    }
    if (S.key) { await syncCloud(); await autoOrganize(); }
    applyHash();
    // 画面に戻ってきたとき（iPhone で切り替えたあと など）も合わせる
    document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && S.key && sb && S.cloudUser) { await syncCloud(); if (S.view === 'list') render(); } });
  })();
}
</script>
</body>
</html>
